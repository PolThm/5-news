name: Daily collection

# The Build Order's inspection window depends on days of real output piling up
# without anyone starting them. This is what makes that happen.
#
# 05:30 UTC: after European morning editions have published, before the author
# would normally look. The exact hour matters less than its stability — cycles
# at a consistent time make day-to-day diffs comparable.
#
# The other triggers exist because summarize is a two-phase batch (AD-11):
# the 05:30 run submits its Claude batches and exits without waiting, so it can
# never publish its own Briefings. Something has to come back for them. With a
# single daily trigger that "something" was the *next day's* run, so every
# Briefing shipped a day stale -- the first real GDELT cycle (2026-08-19)
# published only because a follow-up was fired by hand.
#
# They are catch-ups, and `--resume-only` is what makes several of them safe.
# A plain extra trigger is not free: a run with nothing pending starts a whole
# new cycle from collect, paying for another round of embeddings and summaries.
# With the flag, a catch-up that finds nothing to finish exits immediately, so
# the ones that follow a successful 06:30 cost nothing at all.
#
# Why more than one: an hour is empirical, not a guarantee. The 2026-08-19
# batches took ~29 minutes for 3x20 summaries, while the Batch API's own
# commitment is 24 hours. A single follow-up meant one slow morning pushed
# publication a full day; 06:30, 08:30 and 11:30 give the batches six hours to
# land while the day's Briefings are still the day's.
#
# Only 05:30 may start a cycle, so the cost stays one cycle per day no matter
# how many catch-ups are added. A manual dispatch defaults to the full
# behaviour -- that is what makes it useful for testing -- and can request a
# catch-up instead with the resume_only input, for the morning when the
# scheduled catch-ups do not fire and batches are left unclaimed.
on:
  schedule:
    - cron: "30 5 * * *" # the full cycle: collect through submit
    - cron: "30 6 * * *" # catch-up
    - cron: "30 8 * * *" # catch-up
    - cron: "30 11 * * *" # catch-up, last chance before the day is stale
  workflow_dispatch: # manual trigger, for testing the cycle without waiting
    inputs:
      resume_only:
        description: "Finish a pending cycle instead of starting a new one"
        type: boolean
        default: false

# One cycle at a time. Two concurrent runs would race on the same commit.
concurrency:
  group: daily-collection
  cancel-in-progress: false

permissions:
  contents: write # the cycle commits its own output

jobs:
  collect:
    name: Collect, dedupe, and cluster
    runs-on: ubuntu-latest
    # Sized against measured stage costs rather than guessed. Story 6.2
    # changed the shape of this: collection is no longer the slow part.
    #
    #   collect   ~15s  (3 GKG slots, static files, no throttle)
    #   dedupe    ~30s
    #   cluster   ~90s  (~92 Cohere batches, paced under a 100k tokens/min
    #                    trial-key limit — this is now the long pole)
    #   summarize   ~5s  (submits batches and exits, per AD-11)
    #
    # ~3 minutes typical. 30 leaves room for a slow upstream while still
    # failing fast if something hangs. The bound matters: a job killed here
    # loses everything it has done, including summarize batches already paid
    # for (Story 6.1 lost two sets of three exactly that way), which is why
    # the adapter also enforces its own MAX_COLLECTION_SECONDS well inside it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the cycle
        env:
          # Story 2.1: clustering calls Cohere embed-v4. A missing/invalid key
          # degrades the cycle (one Cluster per dedupe group, no cross-language
          # merge) rather than failing it — set as a repository secret.
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Story 3.1: summarize calls Claude via the Batch API. Without this
          # the cycle still completes, but every Cluster degrades to its
          # Article title and NO Briefing is ever published — which is exactly
          # what happened on the first real cycle (2026-08-13T20-13-17Z), where
          # the secret existed in the repository but was never injected here.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Only the 05:30 trigger may start a cycle. Every other schedule is a
        # catch-up: it finishes a cycle whose batches are pending and does
        # nothing when none is, so it costs nothing on the days the 06:30 run
        # already published.
        #
        # A manual dispatch defaults to the full behaviour, which is what
        # makes it useful for testing -- but it can now ask for a catch-up
        # instead, via the resume_only input. That gap was not theoretical:
        # on 2026-08-24 the 05:30 run submitted its batches and every
        # scheduled catch-up that day failed to fire, leaving three paid-for
        # batches unclaimed with no way to collect them by hand. The only
        # manual option was a full cycle, which abandons those batches and
        # pays for three more.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            resume_only="${{ inputs.resume_only }}"
          elif [ "${{ github.event.schedule }}" != "30 5 * * *" ]; then
            resume_only=true
          else
            resume_only=false
          fi

          if [ "$resume_only" = "true" ]; then
            uv run python -m pipeline.stages.cycle --resume-only
          else
            uv run python -m pipeline.stages.cycle
          fi

      - name: Commit the cycle's output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only cycle.json is tracked under data/intermediate/ — the bulky
          # per-stage output stays ignored. See .gitignore for why the negation
          # pattern is three lines.
          git add --all data/

          if git diff --cached --quiet; then
            echo "No cycle output to commit — investigate before assuming this is normal."
            exit 0
          fi

          git commit -m "Cycle $(date -u +%Y-%m-%dT%H-%M-%SZ)"

          # Rebase before pushing: a manual run or any other commit landing
          # between checkout and push makes this a non-fast-forward, and a
          # failed push discards the cycle entirely — data/intermediate/ is
          # gitignored, so nothing survives the runner.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the cycle after 3 attempts. Output is lost."
          exit 1

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. A daily pipeline whose only commits come from itself is
      # exactly the case that trips this, so the cycle's own commit above is
      # what keeps the schedule alive. If commits ever stop, the schedule dies
      # silently — that is the failure to watch for.
      - name: Report
        if: always()
        run: |
          echo "Cycle finished with status: ${{ job.status }}"
          echo "A degraded cycle (upstream throttled, feed down) still succeeds."
          echo "Check data/intermediate/<cycle-id>/cycle.json for what failed."
