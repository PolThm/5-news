name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Action versions are pinned to the v7 line. Node 20 is removed from
# GitHub-hosted runners on 2026-09-16; anything below v7 breaks then.
jobs:
  boundary:
    name: Pipeline/site boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the boundary holds
        run: ./scripts/check-boundary.sh

  pipeline:
    name: Pipeline tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Pinned deliberately: uv is 0.x and ships breaking changes between
          # minors. Bump this when you have tested the new version locally.
          version: "0.12.3"

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "site/.nvmrc"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build
