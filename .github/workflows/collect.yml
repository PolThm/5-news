name: Daily collection

# The Build Order's inspection window depends on days of real output piling up
# without anyone starting them. This is what makes that happen.
#
# 05:30 UTC: after European morning editions have published, before the author
# would normally look. The exact hour matters less than its stability — cycles
# at a consistent time make day-to-day diffs comparable.
#
# 06:30 UTC exists because summarize is a two-phase batch (AD-11): the 05:30
# run submits its Claude batches and exits without waiting, so it can never
# publish its own Briefings. Something has to come back for them. With only
# one daily trigger that "something" was the *next day's* run, which meant
# every Briefing shipped a day stale — the first real GDELT cycle
# (2026-08-19) published only because a follow-up was fired by hand.
#
# One follow-up, not several, and this is the reason: a run that finds no
# pending cycle starts a fresh one from collect. So an extra trigger is free
# only while there is something to resume. The steady state is exactly two
# runs a day — 05:30 does the full pipeline and submits, 06:30 resumes and
# publishes, and the published cycle is terminal so tomorrow's 05:30 starts
# clean.
#
# An hour is empirical, not a guarantee: the 2026-08-19 batches took ~29
# minutes for 3x26 summaries, while the Batch API's own commitment is 24
# hours. If 06:30 finds them unfinished it leaves the cycle pending and the
# next day's run resumes it, which is the stale-by-a-day case again — rare,
# self-correcting, and visible in cycle.json's `phase`. Watch for it before
# reaching for a third trigger.
on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch: # manual trigger, for testing the cycle without waiting

# One cycle at a time. Two concurrent runs would race on the same commit.
concurrency:
  group: daily-collection
  cancel-in-progress: false

permissions:
  contents: write # the cycle commits its own output

jobs:
  collect:
    name: Collect, dedupe, and cluster
    runs-on: ubuntu-latest
    # Sized against measured stage costs rather than guessed. Story 6.2
    # changed the shape of this: collection is no longer the slow part.
    #
    #   collect   ~15s  (3 GKG slots, static files, no throttle)
    #   dedupe    ~30s
    #   cluster   ~90s  (~92 Cohere batches, paced under a 100k tokens/min
    #                    trial-key limit — this is now the long pole)
    #   summarize   ~5s  (submits batches and exits, per AD-11)
    #
    # ~3 minutes typical. 30 leaves room for a slow upstream while still
    # failing fast if something hangs. The bound matters: a job killed here
    # loses everything it has done, including summarize batches already paid
    # for (Story 6.1 lost two sets of three exactly that way), which is why
    # the adapter also enforces its own MAX_COLLECTION_SECONDS well inside it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run the cycle
        env:
          # Story 2.1: clustering calls Cohere embed-v4. A missing/invalid key
          # degrades the cycle (one Cluster per dedupe group, no cross-language
          # merge) rather than failing it — set as a repository secret.
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Story 3.1: summarize calls Claude via the Batch API. Without this
          # the cycle still completes, but every Cluster degrades to its
          # Article title and NO Briefing is ever published — which is exactly
          # what happened on the first real cycle (2026-08-13T20-13-17Z), where
          # the secret existed in the repository but was never injected here.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m pipeline.stages.cycle

      - name: Commit the cycle's output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only cycle.json is tracked under data/intermediate/ — the bulky
          # per-stage output stays ignored. See .gitignore for why the negation
          # pattern is three lines.
          git add --all data/

          if git diff --cached --quiet; then
            echo "No cycle output to commit — investigate before assuming this is normal."
            exit 0
          fi

          git commit -m "Cycle $(date -u +%Y-%m-%dT%H-%M-%SZ)"

          # Rebase before pushing: a manual run or any other commit landing
          # between checkout and push makes this a non-fast-forward, and a
          # failed push discards the cycle entirely — data/intermediate/ is
          # gitignored, so nothing survives the runner.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the cycle after 3 attempts. Output is lost."
          exit 1

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. A daily pipeline whose only commits come from itself is
      # exactly the case that trips this, so the cycle's own commit above is
      # what keeps the schedule alive. If commits ever stop, the schedule dies
      # silently — that is the failure to watch for.
      - name: Report
        if: always()
        run: |
          echo "Cycle finished with status: ${{ job.status }}"
          echo "A degraded cycle (upstream throttled, feed down) still succeeds."
          echo "Check data/intermediate/<cycle-id>/cycle.json for what failed."
